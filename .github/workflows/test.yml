name: Automated Tests

on:
  push:
    branches:
      - main
      - 'dev-*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vim
        uses: rhysd/action-setup-vim@v1
        with:
          version: stable

      - name: Check Vim version
        run: vim --version

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/run.ps1

      - name: Run test suite (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./test/run.sh
          ./test/run.sh
